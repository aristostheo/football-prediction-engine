name: Refresh historical results

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-results.yml
      - src/football_predictor/ingestion.py
      - src/football_predictor/team_names.py
      - src/football_predictor/data_status.py
      - src/football_predictor/results_sync.py
      - src/football_predictor/history_paths.py
      - src/football_predictor/sync_checkpoint.py
  schedule:
    - cron: "17 8 * * 2"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: historical-results-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Install project dependencies
        run: uv sync --locked

      - name: Refresh and validate results
        run: uv run python -m football_predictor --refresh

      - name: Report actual results coverage
        if: always()
        run: uv run python -m football_predictor --check-data | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify ingestion and sync tests
        run: uv run pytest tests/test_ingestion.py tests/test_results_sync.py tests/test_sync_checkpoint.py tests/test_data_status.py -q

      - name: Commit changed match data
        run: |
          if git diff --quiet -- data/model/historical_matches.csv.gz; then
            echo "No match-data changes; no commit or deployment is needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/model/historical_matches.csv.gz data/model/historical_matches.manifest.json
          git commit -m "data: refresh historical football results"
          git push

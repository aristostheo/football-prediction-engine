name: Refresh historical results

on:
  schedule:
    - cron: "17 8 * * 2"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: historical-results-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: false

      - name: Install project dependencies
        run: uv sync --locked

      - name: Refresh and validate results
        run: uv run python -m football_predictor --refresh

      - name: Verify ingestion tests
        run: uv run pytest tests/test_ingestion.py -q

      - name: Commit changed match data
        run: |
          if git diff --quiet -- data/model/historical_matches.csv.gz; then
            echo "No match-data changes; no commit or deployment is needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/model/historical_matches.csv.gz data/model/historical_matches.manifest.json
          git commit -m "data: refresh historical football results"
          git push
